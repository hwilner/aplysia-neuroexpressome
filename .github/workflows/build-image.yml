name: build the analysis image

# P01-01.2 — the build that cannot run in the authoring sandbox.
#
# This workflow exists because the environment used to write the Dockerfile has
# no container runtime: no docker, podman, singularity or apptainer, and no
# daemon socket. The build therefore runs here, on a runner that has one, and
# the tool manifest is committed back as an artefact so the resolved versions
# are inspectable without pulling the image.

on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.github/workflows/build-image.yml']
  workflow_dispatch:

jobs:
  # Fast, no Docker. Each environment is solved in its own step, so a conflict
  # names the ecosystem and prints the solver's own message, instead of being
  # collapsed into a one-line buildkit error.
  solve-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install micromamba
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj bin/micromamba
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: env bio
        run: micromamba create -y -n bio -c conda-forge -c bioconda \
              python=3.11 biopython=1.83 diamond=2.1.8 liftoff=1.3.0 \
              busco=5.7.1 hisat2=2.2.1 samtools=1.19 hmmer=3.4 \
              eggnog-mapper=2.1.9 orthofinder=2.5.4 transdecoder=5.7.0 gffread=0.9.9

      - name: env tree
        run: micromamba create -y -n tree -c conda-forge -c bioconda \
              mafft=7.525 trimal=1.5.1 iqtree=2.2.6

      - name: env r
        run: micromamba create -y -n r -c conda-forge -c bioconda \
              r-base=4.4 bioconductor-limma=3.58.1 bioconductor-edger=4.0 \
              r-metafor=4.4_0 r-ggplot2=3.5 r-patchwork=1.2 r-rstatix=0.7 r-testthat=3.2

      # every env is tested even if an earlier one failed, so one run reports
      # the full picture instead of stopping at the first conflict
      - name: env ips
        if: always()
        run: micromamba create -y -n ips -c conda-forge -c bioconda \
              openjdk=11 interproscan=5.59_91.0

      - name: all environments solved
        if: always()
        run: |
          echo "solve-check finished; see the per-environment steps above"

  build:
    needs: solve-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          # a plain, cached build: this is the check that every pin resolves
          docker build -t aplysia-neuroexpressome:test .
          # and a no-cache build, because P01-01.2 asks specifically whether the
          # image builds from a clean cache
          docker build --no-cache -t aplysia-neuroexpressome:nocache .

      - name: Probe each environment separately
        run: |
          set -uo pipefail
          # Each solve is a separate environment, so a failure names the
          # ecosystem that caused it rather than one opaque transaction.
          for env in bio r ips; do
            echo "=== env: $env ==="
            docker run --rm aplysia-neuroexpressome:test \
              micromamba run -n "$env" bash -c 'echo "solvable and present"'
          done
        continue-on-error: true

      - name: Emit the tool manifest
        run: |
          set -euo pipefail
          docker run --rm aplysia-neuroexpressome:test \
            /opt/aplysia/bin/environment.sh > environment.txt
          cat environment.txt

      - name: Fail if any pinned tool is missing
        run: |
          set -euo pipefail
          if grep -q 'NOT FOUND' environment.txt; then
            echo "::error::A tool named in the Dockerfile is absent from the image:"
            grep 'NOT FOUND' environment.txt
            exit 1
          fi
          echo "OK: every tool named in the Dockerfile is present"

      - name: Digest
        run: |
          set -euo pipefail
          docker inspect --format='{{index .RepoDigests 0}}' \
            aplysia-neuroexpressome:test 2>/dev/null \
            || docker images --digests aplysia-neuroexpressome:test
          docker image inspect --format='{{.Id}}' aplysia-neuroexpressome:test

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: environment-manifest
          path: environment.txt
          retention-days: 90

      - name: Record the result
        run: |
          set -euo pipefail
          {
            echo "## P01-01.2 build result"
            echo
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```'
            cat environment.txt
            echo '```'
          } > build-result.md

      - name: Upload the build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: build-result.md
          retention-days: 365
