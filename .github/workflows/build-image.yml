name: build the analysis image

# P01-01.2 - the build that cannot run in the authoring sandbox.
#
# This workflow exists because the environment used to write the Dockerfile has
# no container runtime: no docker, podman, singularity or apptainer, and no
# daemon socket. The build therefore runs here, on a runner that has one, and
# the tool manifest is committed back as an artefact so the resolved versions
# are inspectable without pulling the image.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
      - 'scripts/environments.py'
  workflow_dispatch:

# Least privilege: the workflow only needs to read the tree.
permissions:
  contents: read

jobs:
  # The Dockerfile is the single source of truth for the pins. Reading the
  # environments from there means the environments this workflow solves are
  # the environments the image builds, and an environment added to the image
  # cannot then be quietly skipped by the checks.
  environments:
    name: read the environments from the Dockerfile
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.definitions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: definitions
        name: List the environments
        run: |
          set -euo pipefail
          python3 scripts/environments.py --format=json > environments.json
          cat environments.json
          echo "matrix=$(cat environments.json)" >> "$GITHUB_OUTPUT"

  # Fast, no Docker. Each environment is solved in its own job, so a conflict
  # names the ecosystem and prints the solver's own message, instead of being
  # collapsed into a one-line buildkit error. Every environment is attempted
  # even when an earlier one fails, so one run reports the full picture.
  solve-check:
    name: solve env ${{ matrix.environment.name }}
    needs: environments
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install micromamba
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj bin/micromamba
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Solve the environment
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment.name }}
          ENVIRONMENT_PINS: ${{ matrix.environment.pins }}
        run: |
          set -euo pipefail
          micromamba create -y -n "$ENVIRONMENT_NAME" \
            -c conda-forge -c bioconda $ENVIRONMENT_PINS

      # The solver names the package it cannot install but not the
      # requirement that rules it out, so ask the package index for the
      # requirement. The JSON output is the only form that carries it: the
      # plain text output is the solver's progress log, and the earlier
      # version of this step truncated that log before the requirement
      # appeared, so it reported nothing at all.
      - name: What each pin actually requires
        if: always()
        env:
          ENVIRONMENT_PINS: ${{ matrix.environment.pins }}
        run: |
          set -uo pipefail
          for pin in $ENVIRONMENT_PINS; do
            echo "=== $pin ==="
            micromamba repoquery depends "$pin" -c conda-forge -c bioconda --json 2>/dev/null \
              | python3 scripts/requirements.py || echo "  (no index entry)"
          done

  build:
    needs: solve-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          # a plain, cached build: this is the check that every pin resolves
          # and a no-cache build, because P01-01.2 asks specifically whether the
          # image builds from a clean cache
          docker build -t aplysia-neuroexpressome:test .
          docker build --no-cache -t aplysia-neuroexpressome:nocache .

      - name: List the environments in the image
        run: python3 scripts/environments.py > environments.tsv

      - name: Probe each environment separately
        run: |
          set -uo pipefail
          # Every environment the Dockerfile defines, not a hand-written list:
          # an environment that was added to the image and then left out of
          # this loop was never probed at all.
          status=0
          while IFS=$'\t' read -r env pins; do
            echo "=== env: $env ==="
            if ! docker run --rm aplysia-neuroexpressome:test \
                 micromamba run -n "$env" bash -c 'echo "solvable and present"'; then
              echo "::error::The $env environment is not usable in the built image."
              status=1
            fi
          done < environments.tsv
          exit "$status"

      - name: Emit the tool manifest
        run: |
          set -euo pipefail
          docker run --rm aplysia-neuroexpressome:test \
            /opt/aplysia/bin/environment.sh > environment.txt
          cat environment.txt

      - name: Fail if any pinned tool is missing
        run: |
          set -euo pipefail
          # The helper prints this when the image has no manifest at all.
          # That is a manifest stage that failed, not a manifest that is
          # empty, and it has to be reported as what it is.
          if grep -q 'no manifest' environment.txt; then
            echo "::error::The image has no tool manifest. The manifest stage did not run."
            exit 1
          fi
          # An empty manifest means the manifest stage did not run, and an
          # empty manifest passes every check below it.
          if [ ! -s environment.txt ]; then
            echo "::error::The tool manifest is empty. The manifest stage did not run."
            exit 1
          fi
          # Every environment the image defines has to be in the manifest. A
          # missing section means the tools of that environment were never
          # looked for.
          missing=0
          while IFS=$'\t' read -r env pins; do
            if ! grep -qF "## env: $env" environment.txt; then
              echo "::error::The manifest has no section for the $env environment."
              missing=1
            fi
          done < environments.tsv
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if grep -q 'NOT FOUND' environment.txt; then
            echo "::error::A tool named in the Dockerfile is absent from the image:"
            grep 'NOT FOUND' environment.txt
            exit 1
          fi
          echo "OK: every tool named in the Dockerfile is present"

      - name: Digest
        run: |
          set -euo pipefail
          docker inspect --format='{{index .RepoDigests 0}}' \
            aplysia-neuroexpressome:test 2>/dev/null \
            || docker images --digests aplysia-neuroexpressome:test
          docker image inspect --format='{{.Id}}' aplysia-neuroexpressome:test

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: environment-manifest
          path: environment.txt
          retention-days: 90

      - name: Record the result
        run: |
          set -euo pipefail
          {
            echo "## P01-01.2 build result"
            echo
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```'
            cat environment.txt
            echo '```'
          } > build-result.md

      - name: Upload the build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: build-result.md
          retention-days: 365
